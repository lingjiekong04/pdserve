[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdserve-research"
version = "0.1.0"
description = "Observable Prefill/Decode serving and bounded request admission"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
